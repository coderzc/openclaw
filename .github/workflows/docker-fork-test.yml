name: Docker Fork Test

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref, branch, or commit SHA to build
        required: true
        default: main
        type: string
      image_tag:
        description: Image tag suffix to publish to GHCR
        required: true
        type: string
  push:
    tags:
      - "docker-test-*"

concurrency:
  group: docker-fork-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve build inputs
        id: vars
        shell: bash
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            source_ref="${DISPATCH_SOURCE_REF}"
            image_tag="${DISPATCH_IMAGE_TAG}"
          else
            source_ref="${GITHUB_SHA}"
            image_tag="${GITHUB_REF_NAME#docker-test-}"
          fi

          if [[ -z "${source_ref}" || -z "${image_tag}" ]]; then
            echo "::error::source_ref and image_tag must be set"
            exit 1
          fi

          normalized_tag="$(printf '%s' "${image_tag}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${normalized_tag}" =~ ^[a-z0-9._-]+$ ]]; then
            echo "::error::image_tag may only contain lowercase letters, digits, '.', '_' and '-'"
            exit 1
          fi

          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${normalized_tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.source_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve OCI labels
        id: labels
        shell: bash
        run: |
          set -euo pipefail
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "value<<EOF"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.version=${{ steps.vars.outputs.image_tag }}"
            echo "org.opencontainers.image.created=${created}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push default image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          labels: ${{ steps.labels.outputs.value }}

      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            OPENCLAW_VARIANT=slim
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}-slim
          labels: ${{ steps.labels.outputs.value }}
